name: Build & Publish APK to GitHub Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-release-eligibility:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - name: Checkout version config
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            app/build.gradle.kts

      - name: Check if build is a public release
        id: check
        run: |
          VERSION_NAME=$(grep -E '^\s*versionName\s*=' app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "Detected versionName=${VERSION_NAME}"
          if [[ "$VERSION_NAME" == *-debug* || "${GITHUB_REF}" == refs/tags/*-debug* ]]; then
            echo "Debug version ($VERSION_NAME) detected. Skipping public GitHub Release so Releases page and in-app updater stay untouched."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  build-and-release:
    needs: check-release-eligibility
    if: needs.check-release-eligibility.outputs.should_release == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare environment secrets
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
        run: |
          if [ -n "$SPOTIFY_CLIENT_ID" ]; then
            echo "SPOTIFY_CLIENT_ID=$SPOTIFY_CLIENT_ID" > .env
          elif [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

      - name: Prepare Firebase configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -f app/google-services.json ]; then
            echo "Using repository app/google-services.json"
          elif [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          elif [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
          else
            echo "::error::app/google-services.json is missing. Add GOOGLE_SERVICES_JSON (file contents of app/google-services.json) or GOOGLE_SERVICES_JSON_BASE64 in GitHub Repository Secrets."
            exit 1
          fi

      - name: Decode signing keystore
        id: signing
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$UPLOAD_KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
            echo "build_type=release" >> "$GITHUB_OUTPUT"
          elif [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "Using DEBUG_KEYSTORE_BASE64 secret for consistent debug signing"
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > debug.keystore
            echo "build_type=debug" >> "$GITHUB_OUTPUT"
          elif [ -f debug.keystore.base64 ]; then
            echo "Decoding repository debug.keystore.base64"
            base64 -d debug.keystore.base64 > debug.keystore
            echo "build_type=debug" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No persistent keystore found; generating an ephemeral debug.keystore. Set DEBUG_KEYSTORE_BASE64 or UPLOAD_KEYSTORE_BASE64 in GitHub Secrets for in-place updates."
            keytool -genkeypair -noprompt \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "build_type=debug" >> "$GITHUB_OUTPUT"
          fi
          if [ -f my-upload-key.jks ]; then
            keytool -list -v -keystore my-upload-key.jks -alias upload -storepass "$STORE_PASSWORD" | grep -E "SHA1:|SHA256:" || true
          elif [ -f debug.keystore ]; then
            keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android | grep -E "SHA1:|SHA256:" || true
          fi

      - name: Resolve release tag & changelog description
        id: meta
        run: |
          VERSION_NAME=$(grep -E '^\s*versionName\s*=' app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${VERSION_NAME}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"

          > release-notes.md
          if [ -f RELEASE_NOTES.md ]; then
            cat RELEASE_NOTES.md >> release-notes.md
            echo "" >> release-notes.md
          fi

          PREV_TAG=$(git tag --sort=-creatordate | grep -v "^${TAG}$" | head -n 1 || true)
          echo "### Recent Commits" >> release-notes.md
          if [ -n "$PREV_TAG" ]; then
            git log "${PREV_TAG}..HEAD" --no-merges --pretty=format:"- %s (%h)" >> release-notes.md || true
          else
            git log -n 10 --no-merges --pretty=format:"- %s (%h)" >> release-notes.md || true
          fi
          echo "" >> release-notes.md

      - name: Run unit tests
        run: >
          gradle :app:testDebugUnitTest
          --tests 'com.example.data.model.MonthlyBillingSummaryTest'
          --tests 'com.example.data.service.AppUpdateServiceTest'
          --tests 'com.example.ExampleUnitTest'

      - name: Build APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "${{ steps.signing.outputs.build_type }}" = "release" ]; then
            gradle :app:assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "AtaPotify-${{ steps.meta.outputs.tag }}.apk"
          else
            gradle :app:assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "AtaPotify-${{ steps.meta.outputs.tag }}-debug.apk"
          fi

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: AtaPotify ${{ steps.meta.outputs.tag }}
          body_path: release-notes.md
          generate_release_notes: true
          make_latest: true
          files: AtaPotify-*.apk
